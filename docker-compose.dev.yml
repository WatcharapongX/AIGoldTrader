# Opt-in development override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --no-proxy-headers --host 0.0.0.0 --port 8000 --reload"
  frontend:
    build:
      target: build
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
