name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aigold_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d aigold_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TRADING_MODE: PAPER
      LIVE_AUTO_TRADING: "false"
      SECRET_KEY: ci-secret-key-at-least-32-bytes-long!!
      DATABASE_URL: postgresql://ci:ci-test-only@localhost:5432/aigold_ci
      TEST_DATABASE_URL: postgresql://ci:ci-test-only@localhost:5432/aigold_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Unit + integration tests (PG service is mandatory; integration must not silently skip)
        run: >
          python -m pytest tests -q
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=0
      - name: Alembic head matches models
        run: alembic check
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: |
          pip install -e . pip-audit
          pip-audit --desc on || true
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
