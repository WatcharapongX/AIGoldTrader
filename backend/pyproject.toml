[project]
name = "ai-trading-backend"
version = "0.1.0"
description = "AI-Assisted Trading Platform backend (XAUUSD & Forex) - PHASE 1 foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.36,<1.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "aiosqlite>=0.20,<1.0",
    "redis>=5.2,<6.0",
    "tzdata>=2025.1",
    "httpx>=0.28,<1.0",
    "pyjwt>=2.10,<3.0",
    "passlib>=1.7.4,<2.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0,<6; sys_platform == 'win32'"]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "fakeredis>=2.26,<3.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-passlib",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
# B008: Depends() in defaults = FastAPI standard pattern
# UP042: (str, Enum) intentional — SQLAlchemy Enum compatibility
# S105/S106: token_type labels & placeholder defaults; real secrets มาจาก env เท่านั้น (G-06)
ignore = ["S101", "B008", "UP042", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"app/tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-q -m "not live_external"'
markers = [
    "live_external: explicit acceptance against real external services (live MT5 terminal or real LLM vendor; never offline fixtures)",
    "integration: opt-in tests against an explicitly configured disposable PostgreSQL database",
]

[[tool.mypy.overrides]]
module = ["app.services.news.*", "app.api.news", "app.services.strategy.*", "app.api.strategy", "app.api.dashboard"]
check_untyped_defs = true
